<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ИЗМЕНИТЬ: заголовок вкладки браузера -->
<title>Лучшая горничная — Голосование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0a0618;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(140, 40, 255, 0.35) 0%, transparent 45%),
      radial-gradient(ellipse at 90% 100%, rgba(0, 220, 255, 0.28) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 10%, rgba(255, 40, 180, 0.18) 0%, transparent 35%);
    min-height: 100vh;
    color: #eae6ff;
    padding: 14px;
    position: relative;
    overflow-x: hidden;
  }

  /* Сканлайны-текстура */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.03) 0px,
      rgba(255, 255, 255, 0.03) 1px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  /* Сетка перспективная (декор) */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(140, 40, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 220, 255, 0.07) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: -1;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 90%);
  }

  /* Флаг России — неоновая «микро-полоска» справа */
  .flag {
    position: fixed;
    top: 14px;
    right: 14px;
    display: flex;
    flex-direction: column;
    width: 20px;
    height: 13px;
    border-radius: 2px;
    overflow: hidden;
    box-shadow:
      0 0 8px rgba(0, 220, 255, 0.6),
      0 0 0 1px rgba(140, 40, 255, 0.5);
    z-index: 100;
  }
  .flag div { flex: 1; }
  .flag .white { background: #eae6ff; }
  .flag .blue  { background: #4573d1; }
  .flag .red   { background: #ff3b3b; }

  /* Шапка */
  header {
    text-align: center;
    padding: 30px 14px 24px;
    max-width: 820px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }
  header .tag {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #00dcff;
    padding: 8px 16px;
    border: 1px solid rgba(0, 220, 255, 0.4);
    border-radius: 4px;
    background: rgba(0, 220, 255, 0.05);
    margin-bottom: 20px;
    box-shadow: inset 0 0 20px rgba(0, 220, 255, 0.1);
    text-shadow: 0 0 10px rgba(0, 220, 255, 0.7);
  }
  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 5.5vw, 2.5rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    line-height: 1.15;
    text-transform: uppercase;
    text-shadow:
      0 0 20px rgba(140, 40, 255, 0.8),
      0 0 40px rgba(140, 40, 255, 0.4);
  }
  header h1 span {
    display: block;
    background: linear-gradient(90deg, #00dcff 0%, #ff28b4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 15px rgba(255, 40, 180, 0.6));
  }
  header h1::after {
    content: "// ГЛАВНЫЙ РАУНД //";
    display: block;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 4px;
    color: #8b7bb8;
    margin-top: 16px;
    text-shadow: none;
  }
  header p {
    margin-top: 18px;
    font-size: clamp(0.88rem, 3vw, 1rem);
    color: #a99ac8;
    line-height: 1.55;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
    font-weight: 400;
  }

  /* Контейнер карточек */
  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
    max-width: 820px;
    margin: 0 auto;
    padding: 4px;
    position: relative;
    z-index: 2;
  }
  @media (min-width: 640px) {
    .cards { grid-template-columns: 1fr 1fr; gap: 28px; }
  }

  .card {
    background: linear-gradient(160deg, #1a1030 0%, #120a24 100%);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid rgba(140, 40, 255, 0.35);
    box-shadow:
      0 0 0 1px rgba(0, 220, 255, 0.1),
      0 0 30px rgba(140, 40, 255, 0.15),
      inset 0 0 30px rgba(140, 40, 255, 0.05);
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(0, 220, 255, 0.6);
    box-shadow:
      0 0 0 1px rgba(0, 220, 255, 0.3),
      0 0 40px rgba(0, 220, 255, 0.35),
      0 0 60px rgba(140, 40, 255, 0.3),
      inset 0 0 30px rgba(0, 220, 255, 0.08);
  }

  /* Уголки-скобки на карточке */
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid #00dcff;
    z-index: 3;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(0, 220, 255, 0.7);
  }
  .card::before {
    top: 8px;
    left: 8px;
    border-right: none;
    border-bottom: none;
    border-radius: 6px 0 0 0;
  }
  .card::after {
    bottom: 8px;
    right: 8px;
    border-left: none;
    border-top: none;
    border-radius: 0 0 6px 0;
  }

  .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #1a1030;
    filter: saturate(1.2) contrast(1.1) brightness(0.95) hue-rotate(-5deg);
  }
  @media (min-width: 640px) {
    .photo { aspect-ratio: 4 / 5; }
  }

  .card-body {
    padding: 18px 18px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex-grow: 1;
  }

  .name {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.95rem, 3.3vw, 1.15rem);
    font-weight: 700;
    text-align: center;
    color: #fff;
    line-height: 1.3;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(0, 220, 255, 0.5);
  }
  .name::after {
    content: "";
    display: block;
    width: 40px;
    height: 2px;
    margin: 9px auto 0;
    background: linear-gradient(90deg, #00dcff, #ff28b4);
    box-shadow: 0 0 10px rgba(0, 220, 255, 0.8);
  }

  /* Кнопка — неоновая с пульсацией */
  .btn-vote {
    display: inline-block;
    width: 100%;
    padding: 15px 20px;
    background: linear-gradient(135deg, #a020f0 0%, #00dcff 100%);
    color: #0a0618;
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.85rem, 2.9vw, 0.95rem);
    font-weight: 900;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-align: center;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: filter 0.2s ease, transform 0.1s ease, box-shadow 0.3s ease;
    box-shadow:
      0 0 20px rgba(140, 40, 255, 0.6),
      0 0 40px rgba(0, 220, 255, 0.3),
      inset 0 -2px 0 rgba(0, 0, 0, 0.2);
    animation: pulseGlow 2.5s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-vote:hover {
    filter: brightness(1.15);
    box-shadow:
      0 0 30px rgba(140, 40, 255, 0.9),
      0 0 60px rgba(0, 220, 255, 0.5);
  }
  .btn-vote:active { transform: scale(0.97); }

  @keyframes pulseGlow {
    0%, 100% {
      box-shadow:
        0 0 20px rgba(140, 40, 255, 0.6),
        0 0 40px rgba(0, 220, 255, 0.3),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2);
    }
    50% {
      box-shadow:
        0 0 30px rgba(140, 40, 255, 0.85),
        0 0 60px rgba(0, 220, 255, 0.45),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2);
    }
  }

  footer {
    text-align: center;
    padding: 36px 14px 24px;
    color: #6b5a8c;
    font-size: 0.72rem;
    letter-spacing: 3px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }
  footer::before {
    content: "";
    display: block;
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00dcff, transparent);
    margin: 0 auto 14px;
    box-shadow: 0 0 8px rgba(0, 220, 255, 0.7);
  }
</style>
</head>
<body>

  <div class="flag" aria-label="Флаг России">
    <div class="white"></div>
    <div class="blue"></div>
    <div class="red"></div>
  </div>

  <header>
    <div class="tag">System Online</div>
    <!-- ИЗМЕНИТЬ: главный заголовок -->
    <h1>Выбери <span>лучшую горничную</span></h1>
    <!-- ИЗМЕНИТЬ: подзаголовок -->
    <p>Один клик — один голос. Выбери участницу, которая достойна победы в этом раунде.</p>
  </header>

  <main class="cards">

    <!-- КАРТОЧКА 1 -->
    <div class="card">
      <img class="photo" src="https://i.ibb.co/tM0dJqvm/image.webp?text=Фото+1" alt="Фото 1">
      <div class="card-body">
        <div class="name">Анастасия</div>
        <a class="btn-vote" href="https://vastgoedfinancieringskompas.online/wl1mdrlmw1phnvgqb1ru" target="_blank" rel="noopener">Голосовать</a>
      </div>
    </div>

    <!-- КАРТОЧКА 2 -->
    <div class="card">
      <img class="photo" src="https://i.ibb.co/93sxyswf/2.webp?text=Фото+2" alt="Фото 2">
      <div class="card-body">
        <div class="name">Вера</div>
        <a class="btn-vote" href="https://vastgoedfinancieringskompas.online/wl1mdrlmw1phnvgqb1ru" target="_blank" rel="noopener">Голосовать</a>
      </div>
    </div>

  </main>

  <footer>
    Голосование 2026 · Подсчёт голосов
  </footer>

</body>
</html>
